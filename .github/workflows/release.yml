name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACK: dms
      PYTHONUTF8: "1"
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "image_core=${REGISTRY}/${OWNER_LC}/cortex:${VERSION}-core" >> "$GITHUB_OUTPUT"
          echo "image_full=${REGISTRY}/${OWNER_LC}/cortex:${VERSION}-full" >> "$GITHUB_OUTPUT"

      - name: Install build + full extras
        run: |
          python -m pip install --upgrade pip wheel build
          pip install -e ".[full,dev]"

      - name: Verify versions + OpenAPI
        run: |
          python scripts/check_versions.py
          python scripts/export_openapi.py --check

      - name: Build wheel
        run: python -m build --wheel

      - name: Changelog since previous tag
        id: changelog
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          {
            echo "## Cortex ${{ steps.ver.outputs.version }}"
            echo
            if [ -n "${PREV}" ]; then
              echo "Changes since ${PREV}:"
              echo
              git log --pretty=format:'- %s (%h)' "${PREV}..HEAD"
            else
              echo "Initial tagged release."
              echo
              git log --pretty=format:'- %s (%h)' --max-count=50
            fi
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist_release
          cp dist/*.whl dist_release/
          # Ship every committed contract generation; consumers pin by filename.
          cp contract/openapi-*.json dist_release/
          (
            cd dist_release
            sha256sum * > SHA256SUMS
          )
          cat dist_release/SHA256SUMS

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.core
          push: true
          tags: |
            ${{ steps.ver.outputs.image_core }}
            ghcr.io/${{ steps.ver.outputs.repo_lc }}:${{ steps.ver.outputs.version }}-core

      - name: Build & push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: true
          tags: |
            ${{ steps.ver.outputs.image_full }}
            ghcr.io/${{ steps.ver.outputs.repo_lc }}:${{ steps.ver.outputs.version }}-full

      - name: Prove -core and -full report different extras
        run: |
          set -euo pipefail
          CORE_IMG="${{ steps.ver.outputs.image_core }}"
          FULL_IMG="${{ steps.ver.outputs.image_full }}"

          docker run -d --name cortex-core-probe -p 18010:8010 "$CORE_IMG"
          docker run -d --name cortex-full-probe -p 18011:8010 "$FULL_IMG"
          cleanup() {
            docker rm -f cortex-core-probe cortex-full-probe >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18010/health >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18011/health >/dev/null 2>&1 && break
            sleep 2
          done

          CORE_FEAT="$(curl -fsS http://127.0.0.1:18010/health/features)"
          FULL_FEAT="$(curl -fsS http://127.0.0.1:18011/health/features)"
          echo "core:  ${CORE_FEAT}"
          echo "full:  ${FULL_FEAT}"

          echo "${CORE_FEAT}" | python -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d["extras"]["agentic"] is False, d
          assert d["extras"]["rag"] is False, d
          '
          echo "${FULL_FEAT}" | python -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d["extras"]["agentic"] is True, d
          assert d["extras"]["rag"] is True, d
          '
          if [ "${CORE_FEAT}" = "${FULL_FEAT}" ]; then
            echo "::error::-core and -full /health/features bodies match — images are not differentiated"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Cortex ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist_release/*.whl
            dist_release/openapi-*.json
            dist_release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
