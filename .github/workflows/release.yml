name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACK: dms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel build
          pip install -e ".[dev,api,dms]"

      - name: Build sdist/wheel
        run: python -m build

      - name: Smoke test built wheel
        run: |
          pip install dist/*.whl
          python -c "from packs.dms import plug_in; assert plug_in()['pack']=='dms'"

      - name: Full test suite on release candidate
        run: python -m pytest tests/ -q --tb=short
