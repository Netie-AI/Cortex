# Secrets hygiene (C-SEC-3) — block key-shaped strings and tracked secret files.
name: Secrets Scan

on:
  push:
    branches: [main, dms-integrated-engine, dms-v2]
  pull_request:
    branches: [main, dms-integrated-engine, dms-v2]

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan working tree
        run: python -m scripts.secrets_scan
      - name: Unit tests for scanner
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/security/test_secrets_scan.py -q --tb=short
