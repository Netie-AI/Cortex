name: Test

# Superseded by ci.yml for push/PR. Kept for manual full-suite runs.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK: dms
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[full,dev]"

      - name: Secrets scan
        run: python -m scripts.secrets_scan

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
