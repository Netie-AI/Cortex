name: Test

# Superseded by ci.yml for push/PR. Kept for manual full-suite runs.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK: dms
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[full,dev]"

      - name: Secrets scan
        run: python -m scripts.secrets_scan

      - name: OpenVault at the HX-01 mirror pin (for tests/harness/test_ov_key_envs.py)
        # Public repo, no token. Only the files the drift test reads are checked
        # out. Under CI the test fails, not skips, if OPENVAULT_SRC is missing.
        run: |
          set -euo pipefail
          read -r OV_REPO OV_PIN < <(python -c "from CortexOS.integrations.harness import ov_key_envs as m; print(m.OV_REPO, m.OV_PIN)")
          OV_DIR="${RUNNER_TEMP}/OpenVault"
          git init -q "${OV_DIR}"
          git -C "${OV_DIR}" sparse-checkout set --no-cone $(python -c "from CortexOS.integrations.harness import ov_key_envs as m; print(' '.join(sorted(set(m.OV_SOURCES.values()))))")
          git -C "${OV_DIR}" fetch -q --depth 1 --filter=blob:none "https://github.com/${OV_REPO}.git" "${OV_PIN}"
          git -C "${OV_DIR}" checkout -q FETCH_HEAD
          test "$(git -C "${OV_DIR}" rev-parse HEAD)" = "${OV_PIN}"
          echo "OPENVAULT_SRC=${OV_DIR}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
