name: CI

on:
  push:
    branches: [main, dms-integrated-engine, dms-v2]
  pull_request:
    branches: [main, dms-integrated-engine, dms-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PACK: dms
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (full + dev)
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[full,dev]"

      - name: Ruff
        run: ruff check CortexOS packages/cortex_contract scripts tests/packaging tests/contract

      - name: Mypy
        run: mypy

      - name: Import linter
        # Cold caches, always. The same tree answered "2 kept, 0 broken" warm and
        # "1 kept, 1 broken" cold (C2-01) — a boundary whose verdict depends on
        # cache warmth is not a boundary. Cheap here; the graph is ~300 files.
        run: |
          rm -rf .grimp_cache .import_linter_cache
          lint-imports

      - name: Version lines
        run: python scripts/check_versions.py

      - name: OpenAPI drift (requires [full])
        run: |
          python -c "import dbos,qdrant_client,tantivy,sentence_transformers"
          python scripts/export_openapi.py --check

      - name: Contract compatibility
        # Every published minor must differ from its predecessor only additively,
        # and each frozen spec must match its .sha256 sidecar — that sidecar is
        # what a consumer checks a vendored copy against.
        run: python scripts/check_contract_compat.py

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short

  base-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACK: dms
      PYTHONUTF8: "1"
      CORTEX_PROFILE: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base only (no agentic/rag extras)
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Base import surface
        run: python -m pytest tests/packaging/test_base_install.py -q --tb=short

  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard invariants / contract / importlinter
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "${BASE_REF}" ]; then
            echo "No base ref — skipping protected-path diff"
            exit 0
          fi
          # Asked per commit, not once over the squashed range.
          #
          # This used to diff BASE..HEAD and then read only `git log -1 HEAD`,
          # which was wrong in both directions. It failed any multi-commit PR
          # where the declaring commit was not the tip - a docs commit landing
          # afterwards was enough. And it passed a PR whose tip happened to say
          # INVARIANT-CHANGE while an earlier commit quietly gutted a contract
          # test, which is the direction that matters: the marker was attached
          # to the wrong thing. CLAUDE.md section 2 says "a commit body must
          # contain INVARIANT-CHANGE:", and the commit it means is the one doing
          # the changing.
          FAILED=0
          for SHA in $(git rev-list "${BASE_REF}".."${HEAD_REF}"); do
            TOUCHED="$(git diff-tree --no-commit-id --name-only -r "${SHA}" \
              | grep -E '^(tests/invariants/|tests/contract/|\.importlinter)' || true)"
            if [ -z "${TOUCHED}" ]; then
              continue
            fi
            if git log -1 --pretty=%b "${SHA}" | grep -q 'INVARIANT-CHANGE:'; then
              echo "OK      ${SHA} declares INVARIANT-CHANGE:"
            else
              echo "::error::commit ${SHA} changed protected paths without INVARIANT-CHANGE: in its body"
              git log -1 --format='        %h %s' "${SHA}"
              echo "${TOUCHED}" | sed 's/^/          /'
              FAILED=1
            fi
          done
          if [ "${FAILED}" -eq 0 ]; then
            echo "Every commit touching a protected path declares why."
          fi
          exit "${FAILED}"
