# OpenDMS governed metrics (Q1) — the "trusted assets" the Q2 answer engine
# compiles against. The LLM (Q2 L1) only picks a metric id + fills slots; the
# SQL is compiled deterministically here and re-verified by the sqlglot guardrail.
#
# param kinds (enforced by loader._render_param):
#   int    → validated to int within [min,max], rendered as a number
#   enum   → validated against `values`, rendered as the bare token (ASC/DESC/…)
#   value  → validated against the value dictionary for `column`, rendered '…'
#   filter → optional; column+op; renders "AND <col> <op> '<value>'" or "" when absent
#   nfilter→ optional numeric; renders "AND <col> <op> <number>" or "" when absent
#
# kind: scalar | listing | ranked | grouped  (hint for Q2 answer shaping)

metrics:
  # ── inventory ───────────────────────────────────────────────────────────────
  - id: sku_count
    kind: scalar
    synonyms:
      - "how many skus"
      - "number of skus"
      - "sku count"
      - "distinct skus"
      - "count skus"
      - "how many distinct SKUs are in stock"
      - "total number of SKUs we carry"
      - "count our inventory items"
      - "what's our SKU count"
      - "how many products are we stocking"
      - "how many skus are there"
      - "How many unique SKUs do we carry across all warehouses?"
      - "berapa banyak SKU kita ada?"
      - "How many SKUs are in inventory?"
    result_columns: [sku_count]
    sql: "SELECT COUNT(DISTINCT sku) AS sku_count FROM inventory"

  - id: low_stock
    kind: listing
    synonyms:
      - "below reorder"
      - "low stock"
      - "understocked"
      - "need reordering"
      - "reorder"
      - "Which SKUs are below reorder level?"
      - "what is running low in warehouse A"
      - "SKUs under their reorder point at WH-A"
      - "which products need replenishment in warehouse A"
      - "WH-A items below reorder"
      - "warehouse A stockouts risk"
      - "everything under the reorder point"
      - "which products are running low across all sites"
    result_columns: [sku, quantity_kg]
    sql: >
      SELECT i.sku, i.quantity_kg
      FROM inventory i LEFT JOIN locations l ON i.location_id = l.location_id
      WHERE i.quantity_kg < i.reorder_level_kg AND i.reorder_level_kg > 0 {wh}
      ORDER BY i.quantity_kg ASC
    params:
      wh: {kind: filter, column: location_code, table: l, op: "=", optional: true}

  - id: expired_items
    kind: listing
    synonyms:
      - "expired"
      - "past expiry"
      - "out of date"
      - "show expired"
      - "list expired"
      - "what stock has gone past its expiry date"
      - "show me out of date inventory"
      - "list SKUs past shelf life"
    result_columns: [sku]
    sql: >
      SELECT sku FROM inventory
      WHERE expiry_date IS NOT NULL AND CAST(expiry_date AS DATE) < CURRENT_DATE
      ORDER BY expiry_date ASC

  - id: expired_count
    kind: scalar
    synonyms:
      - "how many expired"
      - "count expired"
      - "number of expired"
      - "expired count"
      - "How many items are expired right now?"
    result_columns: [expired_count]
    sql: >
      SELECT COUNT(*) AS expired_count FROM inventory
      WHERE expiry_date IS NOT NULL AND CAST(expiry_date AS DATE) < CURRENT_DATE

  - id: expired_last_month
    kind: scalar
    synonyms: ["expired last month", "how many expired last month", "expired previous month"]
    result_columns: [expired_count]
    sql: >
      SELECT COUNT(*) AS expired_count FROM inventory
      WHERE expiry_date IS NOT NULL
        AND date_trunc('month', CAST(expiry_date AS DATE))
          = date_trunc('month', CURRENT_DATE) - INTERVAL 1 MONTH

  - id: stale_restock
    kind: listing
    synonyms:
      - "not restocked"
      - "stale stock"
      - "old stock"
      - "Which items were not restocked in the last 30 days?"
      - "what has not been topped up in a month"
      - "items with no restock in 30 days"
      - "which SKUs have gone stale on the shelf"
    result_columns: [sku]
    sql: >
      SELECT sku FROM inventory
      WHERE CAST(last_restocked AS DATE) < CURRENT_DATE - INTERVAL {days} DAY
      ORDER BY last_restocked ASC
    params:
      days: {kind: int, default: 30, min: 1, max: 3650}

  - id: items_by_category
    kind: listing
    synonyms:
      - "items in category"
      - "list category"
      - "products in"
      - "show me everything in the chemicals category"
      - "what chemical products do we hold"
    result_columns: [sku]
    sql: "SELECT sku FROM inventory WHERE category = {category} ORDER BY sku"
    params:
      category: {kind: value, column: category, required: true}

  - id: stock_value_by_category
    kind: grouped
    synonyms:
      - "stock value by category"
      - "inventory value per category"
      - "value by category"
      - "what is our inventory worth per category"
      - "value of stock held broken down by category"
    result_columns: [category, total_value_myr]
    sql: >
      SELECT category, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS total_value_myr
      FROM inventory GROUP BY category ORDER BY total_value_myr DESC

  - id: sku_count_by_category
    kind: grouped
    synonyms:
      - "sku count by category"
      - "how many per category"
      - "products per category"
      - "number of products in each category"
      - "how many SKUs per category"
    result_columns: [category, sku_count]
    sql: >
      SELECT category, COUNT(*) AS sku_count FROM inventory
      GROUP BY category ORDER BY sku_count DESC

  # ── transactions / sales ────────────────────────────────────────────────────
  - id: sales_by_value
    kind: ranked
    synonyms:
      - "top selling"
      - "best sellers"
      - "revenue by sku"
      - "sales by value"
      - "highest revenue"
      - "excluding BETA, top 5 sku by revenue"
      - "ignore SKU-BETA and also show the top 5 SKUs by revenue"
      - "our five biggest earners by sales value"
      - "which SKUs bring in the most money, top 5"
      - "rank the top 5 products by revenue"
      - "top five SKUs ranked by outbound revenue"
      - "list the highest-revenue products, limit 5"
      - "show me the five SKUs that sell the most value"
      - "ignore BETA and show top five by revenue"
      - "top 5 revenue SKUs without SKU-BETA"
      - "excluding SKU-BETA, what are the top 5 by sales"
      - "ignoring 00173 what is the top 5 sku by revenue"
      - "excluding SKU-BETA, top 5 sku by revenue"
      - "what is the top 5 sku by revenue"
      - "number 6-10 sku by revenue"
      - "show me the five highest-revenue SKUs"
      - "tunjukkan top 5 SKU mengikut revenue"
      - "kecuali BETA, top 5 sku revenue"
      - "Show top 5 SKU by revenue in ringgit"
      - "ignore SKU-BETA and show the top 5 SKUs by revenue"
      - "ignore BETA and show the top 5 SKUs by revenue"
      - "keluarkan BETA dari top 5 sku revenue"
      - "exclude SKU-BETA and just show the top 5 SKUs by revenue"
      - "buang BETA dan tunjukkan top 5 sku revenue"
      - "excluding SKU-00173 and SKU-00241, what is the top 5 sku by revenue"
      - "ignoring SKU-00173 what is the top 5 sku by revenue"
      - "show the top 5 SKUs by revenue"
    result_columns: [sku, sales_value_myr]
    sql: >
      SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
      FROM transactions WHERE txn_type = 'outbound' {exclude_skus}
      GROUP BY sku ORDER BY sales_value_myr {direction}, sku ASC
      LIMIT {limit}{offset_clause}
    params:
      limit: {kind: int, default: 5, min: 1, max: 1000}
      offset_clause: {kind: offset_clause, default: 0, optional: true}
      direction: {kind: enum, values: [ASC, DESC], default: DESC}
      exclude_skus: {kind: not_in, column: sku, optional: true, resolve: true}

  - id: sales_by_volume
    kind: ranked
    synonyms:
      - "top by quantity"
      - "most sold by kg"
      - "volume sold"
      - "quantity sold"
      - "three highest selling SKUs by weight"
      - "top 3 products by units shipped out"
      - "which 3 SKUs moved the most kilograms"
    result_columns: [sku, total_sold_kg]
    sql: >
      SELECT sku, SUM(quantity_kg) AS total_sold_kg
      FROM transactions WHERE txn_type = 'outbound' {exclude_skus}
      GROUP BY sku ORDER BY total_sold_kg {direction}, sku ASC
      LIMIT {limit}{offset_clause}
    params:
      limit: {kind: int, default: 5, min: 1, max: 1000}
      offset_clause: {kind: offset_clause, default: 0, optional: true}
      direction: {kind: enum, values: [ASC, DESC], default: DESC}
      exclude_skus: {kind: not_in, column: sku, optional: true, resolve: true}

  - id: revenue_total
    kind: scalar
    synonyms:
      - "total revenue"
      - "what was total revenue"
      - "overall revenue"
      - "all-time revenue"
      - "total sales"
      - "What is our total revenue in MYR?"
    result_columns: [revenue_myr]
    sql: >
      SELECT ROUND(COALESCE(SUM(quantity_kg * unit_cost_myr), 0), 2) AS revenue_myr
      FROM transactions
      WHERE txn_type = 'outbound'

  - id: revenue_windowed
    kind: scalar
    synonyms:
      - "revenue last"
      - "sales in the last"
      - "revenue in days"
      - "recent revenue"
      - "What was our revenue in the last 30 days?"
      - "how much did we sell in the past 30 days"
      - "revenue over the last thirty days"
      - "total sales value in the trailing month"
    result_columns: [revenue_myr]
    sql: >
      SELECT ROUND(COALESCE(SUM(quantity_kg * unit_cost_myr), 0), 2) AS revenue_myr
      FROM transactions
      WHERE txn_type = 'outbound' AND CAST("timestamp" AS TIMESTAMP) >= CURRENT_DATE - INTERVAL {days} DAY
    params:
      days: {kind: int, default: 30, min: 1, max: 3650}

  - id: revenue_last_month
    kind: scalar
    synonyms:
      - "last month sales"
      - "sales last month"
      - "revenue last month"
      - "last month revenue"
      - "What was our revenue last month?"
    result_columns: [revenue_myr]
    sql: >
      SELECT ROUND(COALESCE(SUM(quantity_kg * unit_cost_myr), 0), 2) AS revenue_myr
      FROM transactions
      WHERE txn_type = 'outbound'
        AND date_trunc('month', CAST("timestamp" AS TIMESTAMP))
          = date_trunc('month', CURRENT_DATE) - INTERVAL 1 MONTH

  # ── shipments ───────────────────────────────────────────────────────────────
  - id: delayed_count
    kind: scalar
    synonyms:
      - "how many delayed"
      - "delayed shipment count"
      - "How many shipments are delayed?"
      - "How many delayed shipments are there?"
      - "berapa shipment yang delayed?"
    result_columns: [delayed_count]
    sql: "SELECT COUNT(*) AS delayed_count FROM shipments WHERE status = 'DELAYED'"

  - id: shipments_by_status
    kind: listing
    synonyms:
      - "shipments that are"
      - "list shipments"
      - "shipment status"
      - "delayed shipments"
      - "in transit"
      - "Which shipments are delayed?"
      - "Which shipments are in transit?"
      - "what is running late"
      - "show me the late deliveries"
      - "which consignments are behind schedule"
      - "what is on the road right now"
      - "shipments currently moving"
    result_columns: [shipment_id]
    sql: "SELECT shipment_id FROM shipments WHERE status = {status} ORDER BY shipment_id"
    params:
      status: {kind: value, column: status, required: true}

  - id: count_by_carrier
    kind: grouped
    synonyms:
      - "by carrier"
      - "per carrier"
      - "which carriers"
      - "carrier breakdown"
      - "Which carriers have the most delayed shipments?"
      - "which freight companies are causing the delays"
      - "break the late shipments down by carrier"
      - "delay count per logistics provider"
    result_columns: [carrier, shipment_count]
    sql: >
      SELECT carrier, COUNT(*) AS shipment_count FROM shipments
      WHERE status = {status} GROUP BY carrier ORDER BY shipment_count DESC
    params:
      status: {kind: value, column: status, default: "DELAYED"}

  - id: count_by_destination
    kind: grouped
    synonyms:
      - "per warehouse incoming"
      - "by destination"
      - "incoming per location"
      - "How many delayed incoming shipments per warehouse?"
      - "late inbound loads per site"
      - "how many delayed arrivals at each warehouse"
    result_columns: [location_code, shipment_count]
    sql: >
      SELECT l.location_code, COUNT(*) AS shipment_count
      FROM shipments s JOIN locations l ON s.destination_location_id = l.location_id
      WHERE s.status = {status} GROUP BY l.location_code ORDER BY shipment_count DESC
    params:
      status: {kind: value, column: status, default: "DELAYED"}

  - id: cost_by_destination
    kind: grouped
    synonyms:
      - "shipment cost by destination"
      - "cost per warehouse"
      - "delivery cost by location"
      - "freight spend per destination"
      - "what does shipping cost us by drop-off point"
    result_columns: [location_code, total_cost_myr]
    sql: >
      SELECT l.location_code, ROUND(SUM(s.cost_myr), 2) AS total_cost_myr
      FROM shipments s JOIN locations l ON s.destination_location_id = l.location_id
      GROUP BY l.location_code ORDER BY total_cost_myr DESC

  - id: arriving_window
    kind: listing
    synonyms:
      - "arriving this week"
      - "arriving soon"
      - "incoming within"
      - "due to arrive"
      - "Which shipments are arriving this week?"
      - "what lands this week"
      - "deliveries due in the next seven days"
    result_columns: [shipment_id]
    sql: >
      SELECT shipment_id FROM shipments
      WHERE status = 'IN_TRANSIT'
        AND CAST(expected_arrival AS DATE) <= CURRENT_DATE + INTERVAL {days} DAY
      ORDER BY expected_arrival ASC
    params:
      days: {kind: int, default: 7, min: 1, max: 365}

  # ── suppliers ───────────────────────────────────────────────────────────────
  - id: supplier_ranking
    kind: ranked
    synonyms:
      - "rank suppliers"
      - "supplier score"
      - "compare suppliers"
      - "supplier benchmark"
      - "rank our vendors on risk and lead time together"
      - "combined supplier scorecard ranking"
    result_columns: [supplier_id, ranking_score]
    sql: >
      SELECT supplier_id,
             ROUND((risk_score * 0.65) + ((lead_time_days / 60.0) * 0.35), 3) AS ranking_score
      FROM suppliers
      ORDER BY ranking_score {direction}, risk_score {direction}, lead_time_days {direction}
      LIMIT {limit}
    params:
      limit: {kind: int, default: 10, min: 1, max: 1000}
      direction: {kind: enum, values: [ASC, DESC], default: DESC}

  - id: suppliers_by_risk
    kind: listing
    synonyms:
      - "risk score above"
      - "high risk suppliers"
      - "risky suppliers"
      - "risk over"
      - "Which suppliers have a risk score above 0.7?"
      - "suppliers with risk over 0.7"
      - "show me our riskiest vendors above 0.7"
    result_columns: [supplier_id]
    sql: >
      SELECT supplier_id FROM suppliers
      WHERE risk_score {op} {threshold} ORDER BY risk_score DESC
    params:
      threshold: {kind: float, default: 0.7, min: 0.0, max: 1.0}
      op: {kind: enum, values: [">", ">=", "<", "<="], default: ">"}

  - id: avg_lead_time_by_country
    kind: grouped
    synonyms:
      - "average lead time by country"
      - "mean lead time per country"
      - "lead time by country"
      - "What is the average lead time by supplier country?"
      - "typical lead time per supplier country"
      - "mean days to deliver by country"
    result_columns: [country, avg_lead_time_days]
    sql: >
      SELECT country, ROUND(AVG(lead_time_days), 2) AS avg_lead_time_days
      FROM suppliers GROUP BY country ORDER BY avg_lead_time_days DESC

  - id: spend_by_country
    kind: grouped
    synonyms:
      - "spend by country"
      - "purchasing by country"
      - "total spend per country"
      - "how much do we spend in each supplier country"
      - "procurement spend broken down by country"
    result_columns: [country, total_spend_myr]
    sql: >
      SELECT s.country, ROUND(SUM(i.quantity_kg * i.unit_cost_myr), 2) AS total_spend_myr
      FROM inventory i JOIN suppliers s ON i.supplier_id = s.supplier_id
      GROUP BY s.country ORDER BY total_spend_myr DESC

  - id: audit_overdue
    kind: listing
    synonyms:
      - "audit overdue"
      - "overdue audit"
      - "suppliers needing audit"
      - "which vendors are due for an audit"
      - "suppliers whose audit has lapsed"
    result_columns: [supplier_id]
    sql: >
      SELECT supplier_id FROM suppliers
      WHERE CAST(last_audit_date AS DATE) < CURRENT_DATE - INTERVAL {days} DAY
      ORDER BY last_audit_date ASC
    params:
      days: {kind: int, default: 90, min: 1, max: 3650}

  - id: high_risk_pending
    kind: listing
    synonyms:
      - "high risk pending shipments"
      - "risky suppliers pending"
      - "high-risk with shipments"
      - "risky suppliers who still owe us shipments"
      - "pending deliveries from high risk vendors"
    result_columns: [supplier_name, shipment_id]
    sql: >
      SELECT DISTINCT s.supplier_name, sh.shipment_id
      FROM suppliers s JOIN shipments sh ON s.supplier_id = sh.supplier_id
      WHERE s.risk_score > {threshold} AND sh.status IN ('PENDING', 'IN_TRANSIT')
    params:
      threshold: {kind: float, default: 0.7, min: 0.0, max: 1.0}

  # ── locations ───────────────────────────────────────────────────────────────
  - id: capacity_utilisation
    kind: grouped
    synonyms:
      - "capacity utilisation"
      - "warehouse capacity"
      - "how full"
      - "utilization"
      - "how full is each warehouse"
      - "site by site space usage"
      - "show me utilisation across locations"
      - "warehouse capacity usage percent"
      - "utilization by location"
    result_columns: [location_code, pct_used]
    sql: >
      SELECT location_code, ROUND(100.0 * current_load_kg / capacity_kg, 1) AS pct_used
      FROM locations ORDER BY pct_used DESC
    params: {}

  - id: capacity_above
    kind: listing
    synonyms:
      - "above capacity"
      - "over percent capacity"
      - "near full"
      - "above 90"
      - "which sites are nearly full"
      - "locations running over 90% capacity"
    result_columns: [location_code]
    sql: >
      SELECT location_code FROM locations
      WHERE 100.0 * current_load_kg / capacity_kg > {pct} ORDER BY location_code
    params:
      pct: {kind: int, default: 90, min: 0, max: 100}

  - id: free_capacity
    kind: ranked
    synonyms:
      - "most free capacity"
      - "free space"
      - "available capacity"
      - "spare capacity"
      - "Which warehouse has the most free capacity in kg?"
      - "where do we have the most room left"
      - "which site has the most spare space in kg"
      - "warehouse with the largest free capacity"
    result_columns: [location_code, free_kg]
    sql: >
      SELECT location_code, capacity_kg - current_load_kg AS free_kg
      FROM locations ORDER BY free_kg {direction} LIMIT {limit}
    params:
      limit: {kind: int, default: 1, min: 1, max: 1000}
      direction: {kind: enum, values: [ASC, DESC], default: DESC}

  - id: cold_storage_list
    kind: listing
    synonyms:
      - "cold storage locations"
      - "which are cold storage"
      - "refrigerated warehouses"
      - "which sites are refrigerated"
      - "show me the chilled locations"
      - "senarai lokasi cold storage"
    result_columns: [location_code]
    sql: "SELECT location_code FROM locations WHERE is_cold_storage = true ORDER BY location_code"

  - id: cold_storage_count
    kind: scalar
    synonyms:
      - "how many cold storage"
      - "count cold storage"
      - "number of cold storage"
      - "How many cold storage locations do we have?"
      - "how many refrigerated sites do we run"
      - "count of cold storage locations"
    result_columns: [cold_count]
    sql: "SELECT COUNT(*) AS cold_count FROM locations WHERE is_cold_storage = true"

  - id: cctv_by_location
    kind: listing
    synonyms:
      - "cctv camera"
      - "camera for warehouse"
      - "surveillance camera"
      - "camera feed for warehouse A"
      - "which CCTV covers WH-A"
    result_columns: [location_code, cctv_camera_id]
    sql: >
      SELECT location_code, cctv_camera_id FROM locations
      WHERE location_code = {location} ORDER BY location_code
    params:
      location: {kind: value, column: location_code, required: true}

  # ── alerts ──────────────────────────────────────────────────────────────────
  - id: active_alerts
    kind: listing
    synonyms:
      - "active alerts"
      - "open alerts"
      - "unresolved alerts"
      - "current alerts"
      - "what is currently flagged"
      - "show me open warnings across the network"
    result_columns: [alert_id]
    sql: "SELECT alert_id FROM alerts WHERE resolved = false ORDER BY created_at DESC"
