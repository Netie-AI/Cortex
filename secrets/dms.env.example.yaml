# C-SEC-3 — plaintext TEMPLATE only (fake values). Never commit real secrets here.
#
# Copy to secrets/dms.env.yaml, fill real values, then:
#   sops --encrypt secrets/dms.env.yaml > secrets/dms.env.enc.yaml
# Commit ONLY the .enc.yaml. The plaintext dms.env.yaml is gitignored.
#
# Demo keys below are the SHIPPED public demo identities (safe, non-secret).
# Rotate to real values via SOPS for any non-demo deployment.

# API-key RBAC: "role:secret;role:secret" — demo identities are intentionally public.
DMS_API_KEYS: "viewer:dms-demo-viewer-key;steward:dms-demo-steward-key;admin:dms-demo-admin-key"

# 32-byte base64 AES-256 master key for envelope crypto. FAKE placeholder below.
DMS_MASTER_KEY: "REPLACE_WITH_32_BYTE_BASE64_KEY_do_not_commit_real="

# Optional Ed25519 ledger signing key (hex). FAKE placeholder.
CORTEX_LEDGER_SIGNING_KEY: "REPLACE_WITH_ED25519_SEED_HEX"

# Postgres RLS proof DSN (F7 remainder). Empty by default (SQLite path).
DMS_LEDGER_DSN: ""
