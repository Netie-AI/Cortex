<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift</title>
<style>
:root { --bg:#0e1110; --ink:#e8efe6; --muted:#8a9684; --line:#2a3328; --ok:#7dba6a; --warn:#d4a017; --bad:#d45a4a; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.45 ui-sans-serif,system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
header { padding:20px 24px 8px; border-bottom:1px solid var(--line); }
header h1 { margin:0; font-size:22px; letter-spacing:.02em; }
header p { margin:6px 0 0; color:var(--muted); max-width:52rem; }
main { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; padding:16px 24px 40px; }
@media (max-width:900px){ main { grid-template-columns:1fr; } }
textarea { width:100%; min-height:110px; background:#161b18; color:var(--ink); border:1px solid var(--line); padding:10px; }
button { background:#1f3d24; color:var(--ink); border:1px solid #3d5a3a; padding:8px 12px; margin:4px 4px 0 0; cursor:pointer; }
button.danger { background:#3d1f1f; border-color:#6a3333; }
pre, .log { background:#161b18; border:1px solid var(--line); padding:12px; overflow:auto; font:12px/1.4 ui-monospace,Consolas,monospace; min-height:8rem; }
.badge { display:inline-block; padding:2px 8px; border:1px solid var(--line); color:var(--muted); font-size:12px; margin-right:6px; }
.ok { color:var(--ok); } .bad { color:var(--bad); }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Night Shift</h1>
  <p>SME factory purchasing fleet. Compiles a messy shop-floor chat into one purchase order. Crash it mid-send. Resume. It must not order twice.</p>
  <div id="proof"></div>
</header>
<main>
  <section>
    <h2>1. Inbox (Bring Your Own Friction)</h2>
    <textarea id="inbox">Ah Seng: boss last week M8 bolts almost gone, send 200 pcs tonight same price. Mei Ling: did we already PO the M8? last time the laptop died mid-send and I think we ordered twice.</textarea>
    <div>
      <button id="start">Start sequential + parallel + critic loop</button>
      <button id="approve">Human approve</button>
      <button id="crash" class="danger">Crash before commit</button>
      <button id="resume">Resume (must not mint PO #2)</button>
    </div>
    <h2>Run</h2>
    <pre id="run">no run yet</pre>
  </section>
  <aside>
    <h2>Registry</h2>
    <pre id="reg"></pre>
    <h2>Memory bank</h2>
    <pre id="mem"></pre>
    <h2>Ledger</h2>
    <pre id="led"></pre>
  </aside>
</main>
<script>
let runId = null;
async function j(path, opt){
  const r = await fetch(path, opt);
  const t = await r.text();
  try { return JSON.parse(t); } catch { return { raw:t, status:r.status }; }
}
function show(id, obj){ document.getElementById(id).textContent = JSON.stringify(obj, null, 2); }
async function refreshSide(){
  show("reg", await j("/api/registry"));
  show("mem", await j("/api/memory"));
  show("led", await j("/api/ledger"));
}
document.getElementById("start").onclick = async () => {
  const body = JSON.stringify({ inbox: document.getElementById("inbox").value });
  const out = await j("/api/runs", { method:"POST", headers:{"content-type":"application/json"}, body });
  runId = out.id; show("run", out); refreshSide();
};
document.getElementById("approve").onclick = async () => {
  if (!runId) return;
  show("run", await j("/api/runs/"+runId+"/approve", { method:"POST" }));
};
document.getElementById("crash").onclick = async () => {
  if (!runId) return;
  show("run", await j("/api/runs/"+runId+"/crash", { method:"POST" }));
};
document.getElementById("resume").onclick = async () => {
  if (!runId) return;
  show("run", await j("/api/runs/"+runId+"/resume", { method:"POST" }));
  refreshSide();
};
(async () => {
  const p = await j("/api/proof");
  document.getElementById("proof").innerHTML =
    '<span class="badge">Gemini '+p.gemini_model+'</span>'+
    '<span class="badge">'+p.agent_framework+'</span>'+
    '<span class="badge">'+(p.gcp_service||"local")+'</span>';
  refreshSide();
})();
</script>
</body>
</html>
