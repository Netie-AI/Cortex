# Which contract lines this engine still serves.
#
# A consumer pins a MAJOR.MINOR and reads the matching frozen spec beside this
# file. Listing a version here is a promise: the running engine accepts requests
# shaped by that spec, and `scripts/check_contract_compat.py` proves each newer
# minor differs from its predecessor only additively.
#
# Rules:
#   - Add a minor when a field or endpoint is added that an older consumer can
#     ignore. Both specs stay listed, and both stay on disk.
#   - Never remove an entry while a consumer might be pinned to it, and never
#     delete a frozen spec — that strands them with nothing to verify against.
#   - A breaking change means a new MAJOR and a coordinated consumer release.
#     It is not a commit.

contract_major: 1

supported:
  - version: "1.0"
    spec: openapi-1.0.0.json
    status: superseded
    contract_surface: false
    notes: >
      NOT a contract surface, and retained only so nothing that fetched it is
      left with a dangling reference. R1 exported this before
      CortexOS/api/contract_routes.py existed, so it is a dump of the entire
      engine route table — 169 operations, none of which are the five contract
      operationIds. It does carry the Contract* schemas, which is why a consumer
      generated against it gets the types but no endpoints and has to hand-write
      every call.

      Consequence for consumers: a client generated from this file must be
      regenerated from 1.1.0. There is no compatibility to preserve, because
      there was never a contract surface here to be compatible with.

      Kept on disk, excluded from the pairwise additive check — comparing 169
      engine routes against 5 contract routes reports 164 phantom removals and
      buries the real signal.

  - version: "1.1"
    spec: openapi-1.1.0.json
    status: supported
    contract_surface: true
    notes: >
      First real contract surface: exactly the five allowlisted operationIds
      (ask, submit, ledger.append, ledger.verify, tool.registry).
      Manifest gains pool_id, issued_at, issuer_key_id and per-table
      row_predicates, all optional on the wire. row_predicate_sql is deprecated
      but present, so a 1.0 producer still validates. Strictness lives in the
      verifier (CortexOS.execution.manifest), not the type: a manifest without an
      issuer is refused at verification, where the refusal can be audited.

  - version: "1.2"
    spec: openapi-1.2.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive T7 provenance: Answer gains answer_id, assumptions[],
      contributing_sources[], drillthrough_token; new operationId drillthrough.
      1.1 clients ignore the new fields. canonical_manifest_bytes unchanged.

  - version: "1.3"
    spec: openapi-1.3.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive C-STAMP provenance: model-served L2 Answer gains
      served_provider, served_model, served_local, and served_reason from the
      actual FreeRoute response. 1.2 clients ignore the new fields.
      canonical_manifest_bytes unchanged.

  - version: "1.4"
    spec: openapi-1.4.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive C-MEM (#290) per-Space memory: Answer gains memory_ids_read
      ([] when memory is off or nothing was read), memory_reads (id, kind,
      space_id, source, version, written_at, served_at per entry read) and
      reused (a stored solution re-run on current data; never a validation).
      AskRequest gains optional scored_pack_id. 1.3 clients ignore the new
      fields. canonical_manifest_bytes unchanged.

  - version: "1.5"
    spec: openapi-1.5.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive C-LOOP-A (#303) DMS payload: AskRequest gains optional
      dms_payload (selected tables with columns, and ontology joins) for the
      engine's plan+SQL path, which is off by default, and optional
      plan_sql_confirm (yes runs the closest question, no answers
      "not found in the database"). New schemas AskPayload, AskPayloadTable,
      AskPayloadColumn, AskPayloadJoin, PlanSqlReconfirm. Answer gains optional
      reconfirm, optional plan_sql_rung (plan, error-fed-retry-N, stronger-model,
      or reconfirm; null when this path did not answer), optional model_calls
      (logical complete() counts for plan, each error-fed-retry-N,
      stronger-model and reconfirm, plus total; one per complete() the ladder
      issues; transport or proxy retries such as an upstream 429 are not
      counted; null when this path made no model call) and Badge
      gains reconfirm (a new Badge enum value). AskRequest ignores unknown keys, as
      on 1.4. The wire names model, strict and provider are rejected by name
      with 422. Full request strictness is a declared breaking change (#388).
      Routing stays in OpenVault route config, not a request field.
      1.4 clients omit the fields and get the 1.4 behaviour.
      canonical_manifest_bytes unchanged.

  - version: "1.6"
    spec: openapi-1.6.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive SCHEMA-CONTEXT-01 (#347): POST /v1/insights
      (operationId insights.ask) is on the allowlist. The insights request
      gains optional schema_context (ContractInsightsSchemaContext), read on
      InsightsWireIn, not on AskRequest and not on InsightsAskIn. It is one
      string. Shortlist pick reasons are reason= text inside that string.
      The insights response gains optional usage (ContractInsightsUsage):
      prompt_tokens, completion_tokens, total_tokens, each null when omitted,
      never 0 as a stand-in. The key is omitted when schema_context is
      absent or no count was reported. Clients that omit schema_context
      keep the 279cbd85 envelope. schema_context maxLength is 8192;
      the engine cap is 8192 UTF-8 bytes. 1.5 clients omit the field and
      get the 1.5 behaviour. canonical_manifest_bytes unchanged.

  - version: "1.7"
    spec: openapi-1.7.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive RAG-01 (#415): Badge gains document (a new Badge enum value)
      for an answer drawn from the Space's documents. The answer text cites
      the passages it used and ends with a Sources line naming each
      document; contributing_sources carries one card per document with
      kind "document" and container "documents". It is not governed data and
      is never stamped session. Before 1.7 such an answer fell closed to
      abstain with no source cards. 1.6 clients that do not know the value
      ignore it. No field is added or removed. canonical_manifest_bytes
      unchanged.

  - version: "1.9"
    spec: openapi-1.9.0.json
    status: supported
    contract_surface: true
    notes: >
      Additive GEN-GRANTED-CATALOG-01 (#386). Numbered 1.9 by the founder's
      2026-10-18 ruling (1.8 is reserved for #321); when this line was cut,
      1.8 was not on main, so this step is checked additive against 1.7.
      AskRequest gains optional schema_context, the same string and rule as
      the 1.6 insights field (maxLength 8192; the engine cap is 8192 UTF-8
      bytes). The engine reads it, and samples column values, only with
      CORTEX_GRANTED_CATALOG on (off by default until dms#456); off, only
      the declared type is checked and the ask is answered as without the
      field. It is used only by the plan+SQL path (dms_payload set and that
      path switched on): the SQL prompt is then the signed grant intersected
      with the tables, columns and joins the string declares, and a table
      outside the grant is dropped. A value the insights rule refuses is
      HTTP 422 with that code (schema_context_too_large,
      schema_context_forbidden_char, schema_context_unparsed) before any
      model call. A string that declares no table (schema_context_empty) or
      no granted table (schema_context_ungranted) is a named 200 abstain.
      One wire change for older clients, whatever the switch: AskRequest
      ignores unknown keys, so through 1.7 a schema_context key that was not
      a string or null, or was longer than 8192 characters, was ignored; from
      1.9 the declared type applies and such a value is HTTP 422
      (request validation). A string or null within maxLength is answered as
      before with the switch off.
      AskPayloadColumn gains optional masked (Security ruling on #386): the
      plan+SQL path samples a column's distinct values into its prompt only
      when masked is false. True or absent, the name and type may reach the
      prompt and the values never do. A sampled column gives at most 8
      distinct values, each cut to 64 characters with control and bidi
      characters stripped, and the samples count inside the 8192-byte cap.
      This applies to 1.7 and older clients too: they send no mask state,
      so their plan+SQL asks get no sampled values. 1.7 clients omit
      schema_context and get the 1.7 prompt schema.
      canonical_manifest_bytes unchanged.

  - version: "1.10"
    spec: openapi-1.10.0.json
    status: current
    contract_surface: true
    notes: >
      Additive PICK-READING-01 (founder ruling 2026-10-29, CLAUDE.md section
      9: split readings). Numbered 1.10 after 1.9 (#386); 1.8 stays reserved
      for #321, so this step is checked additive against 1.9. Sort specs by
      version, not lexically: "1.10" sorts before "1.2" as text.
      PlanSqlReconfirm gains optional readings (at most 3 PlanSqlReading
      items: reading_id, statement, row_count, expires_at), omitted when
      empty, so a reconfirm without readings serializes as on 1.9. Readings
      are offered only with the engine's CORTEX_PLAN_SQL_READINGS switch on
      (off by default) and only when two SQL readings of the question
      disagree. A statement is written by Cortex from the gated SQL's syntax
      tree after every literal in it is replaced with "<a value>" and every
      SQL comment is stripped: it carries no returned value, and the only
      literal it shows is the LIMIT row cap. No preview, columns, SQL, rung or
      model is on the wire. statement maxLength 320 holds after the response
      scrub.
      AskRequest gains optional plan_sql_reading_id (1-64 characters): a pick.
      Without dms_payload, or together with plan_sql_confirm, it is HTTP 422
      (reading_needs_payload, reading_excludes_confirm), so Yes still runs the
      closest question and No still answers not found in the database. A
      pick runs the held reading's SQL again through every gate under the
      current session grant (SQL gate, payload scope, lineage, literal
      grounding, the manifest-enforcing execute, empty and implausible
      checks) with no model call; it never reads per-Space memory. An id the
      engine does not hold for this session, Space, manifest hash, request
      (question, dms_payload, schema_context) and scored_pack_id, or past its
      expiry, is HTTP 409 plan_sql_reading_unbound; with the switch off it is
      HTTP 409 plan_sql_reading_unavailable.
      Answer gains optional plan_sql_reading_id, omitted when null: the echo
      of the id sent, on every 200 response to a pick (served, a reconfirm
      the pick re-gated into, or a direct abstain). A served pick is an
      answer the user chose between disagreeing readings, not confirmed by a
      second reading, and must not be presented as validated; its
      plan_sql_rung and served_* name the reading's writer in the offering
      ask, provenance.query_source carries that call id, and model_calls is
      null. A reconfirm or abstain with the echo is shown as what it is,
      never as the pick. Through 1.9 an unknown plan_sql_reading_id key was
      ignored, so a 1.10 consumer must check the echo: a 200 to a pick
      without it, or with another id, came from an engine that ignored the
      field.
      Holds are not per-Space memory under the 1.4.0 rule: read only by exact
      id, no rows, process-local, at most 600 s and never past the manifest
      expiry, bound as above. 1.9 clients send no pick and get the 1.9
      envelope byte for byte. canonical_manifest_bytes unchanged.

deprecated:
  # Present on the wire, removed at the next major. Consumers should migrate.
  - field: Manifest.row_predicate_sql
    since: "1.1"
    removed_in: "2.0"
    reason: >
      One predicate string cannot say which table it applies to, so it cannot be
      injected per table. Send row_predicates instead.

# Canonicalisation is part of the contract, not an implementation detail: DMS
# signs the bytes that cortex_contract.canonical_manifest_bytes() produces and
# Cortex verifies them. contract/testvectors/manifest_canonical.jsonl pins that
# rule so any language can prove agreement without reimplementing it from prose.
canonicalisation:
  function: cortex_contract.execution.canonical_manifest_bytes
  signature_encoding: unpadded-base64url-ed25519
  testvectors: testvectors/manifest_canonical.jsonl
