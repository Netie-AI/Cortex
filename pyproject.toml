[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "netie"
version = "2.5.0"
description = "Cortex governed agentic engine — answer plane + optional agentic/RAG extras"
authors = [
    {name = "Open Source"}
]
requires-python = ">=3.10"
# Base install: answer engine, execution primitives, ledger, F5/F7, semantic
# layer, context assembly. Agentic (DAG/OSR/seeker/routines/commitments) and
# RAG (embeddings/doc index) are optional extras.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "litellm>=1.84.0",
    "wasmtime>=24",
    "pydantic>=2",
    "pyyaml>=6",
    "toml>=0.10",
    "cryptography>=50.0.0",
    "diskcache>=5",
    "sqlite-utils>=3",
    # Answer / DMS / semantic / F5–F7
    "duckdb>=1.1",
    "sqlglot>=25",
    "openpyxl>=3.1",
    "qrcode>=7.4",
    "pillow>=12.3.0",
    "pytz>=2024.1",
    # API shell for answer + context assembly
    "fastapi>=0.141",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# DAG, OSR, seeker, routines, commitments (+ DBOS resume marker)
agentic = ["dbos>=2.28.0,<3"]
# Embeddings + document index
rag = [
    "sentence-transformers>=3",
    "qdrant-client>=1.9",
    "tantivy>=0.22",
]
# Both optional planes
full = [
    "dbos>=2.28.0,<3",
    "sentence-transformers>=3",
    "qdrant-client>=1.9",
    "tantivy>=0.22",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-PyYAML>=6",
]
local-inference = ["llama-cpp-python>=0.2"]
gpu = ["torch>=2", "llama-cpp-python>=0.2"]
a2a = ["websockets>=12"]
personality = ["redis>=5", "sqlalchemy>=2", "APScheduler>=3.10"]
postgres = ["sqlalchemy[asyncio]>=2", "asyncpg>=0.29", "psycopg[binary]>=3.1"]
# Backward-compat aliases
agents = ["dbos>=2.28.0,<3"]
tokens = ["tiktoken>=0.7"]
api = ["fastapi>=0.141", "starlette>=1.3.1", "uvicorn[standard]>=0.30"]
dms = ["duckdb>=1.1", "sqlglot>=25", "openpyxl>=3.1", "qrcode>=7.4", "pillow>=12.3.0", "pytz>=2024.1"]

[tool.poetry]
name = "netie"
version = "2.5.0"
description = "Cortex governed agentic engine — answer plane + optional agentic/RAG extras"
authors = ["Open Source"]
packages = [
    { include = "netie" },
    { include = "CortexOS" },
    { include = "packs" },
    { include = "cortex_contract", from = "packages" }
]

# pip resolves [project].dependencies. Do not reintroduce a caret table here —
# it silently capped cryptography at <43 and pillow at <11. See
# tests/packaging/test_dependency_floors.py.

[tool.poetry.extras]
agentic = ["dbos"]
rag = ["sentence-transformers", "qdrant-client", "tantivy"]
full = ["dbos", "sentence-transformers", "qdrant-client", "tantivy"]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy", "import-linter", "types-PyYAML"]
local-inference = ["llama-cpp-python"]
gpu = ["torch", "llama-cpp-python"]
a2a = ["websockets"]
personality = []
postgres = ["sqlalchemy", "asyncpg", "psycopg"]
agents = ["dbos"]
tokens = ["tiktoken"]
api = []
dms = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
pretty = true
# The contract package is distributed as top-level `cortex_contract`. Without
# this, mypy resolves packages/cortex_contract/*.py as both `cortex_contract.*`
# (the __init__.py walk-up) and `packages.cortex_contract.*` (as a namespace
# package from the root) and refuses to run at all.
mypy_path = "packages"
namespace_packages = false
# A setuptools build/ tree under the package is a *copy* of it, so mypy sees two
# modules named cortex_contract and stops with "errors prevented further
# checking" — exit 2, nothing type-checked, and it reads like an environment
# glitch rather than a disabled gate. Any `pip install -e .` or `python -m
# build` recreates it, so excluding it is the fix; deleting it is not.
exclude = '(^|/)build/'
# Packaging / release infra only — engine modules remain gradually typed.
files = [
    "CortexOS/packaging.py",
    "packages/cortex_contract",
    "scripts/check_versions.py",
    "scripts/export_openapi.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
