[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "netie"
version = "0.1.0"
description = "Netie Cortex OS Edition — AI Coding Agent"
authors = [
    {name = "Open Source"}
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "rank-bm25>=0.2",
    "sentence-transformers>=3",
    "numpy>=1.26",
    "litellm>=1",
    "wasmtime>=24",
    "pydantic>=2",
    "pyyaml>=6",
    "toml>=0.10",
    "cryptography>=42",
    "diskcache>=5",
    "sqlite-utils>=3"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
local-inference = ["llama-cpp-python>=0.2"]
gpu = ["torch>=2", "llama-cpp-python>=0.2"]
rag = ["qdrant-client>=1.9", "tantivy>=0.22"]
a2a = ["websockets>=12"]
personality = ["redis>=5", "sqlalchemy>=2", "APScheduler>=3.10"]
postgres = ["sqlalchemy[asyncio]>=2", "asyncpg>=0.29", "psycopg[binary]>=3.1"]
agents = ["dbos>=2.28.0,<3"]
tokens = ["tiktoken>=0.7"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dms = ["duckdb>=1.1", "sqlglot>=25", "openpyxl>=3.1", "qrcode>=7.4", "pillow>=10"]

[tool.poetry]
name = "netie"
version = "0.1.0"
description = "Netie Cortex OS Edition — AI Coding Agent"
authors = ["Open Source"]
packages = [
    { include = "netie" },
    { include = "CortexOS" },
    { include = "packs" }
]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12"
rich = "^13"
rank-bm25 = "^0.2"
sentence-transformers = "^3"
numpy = "^1.26"
litellm = "^1"
wasmtime = "^24"
pydantic = "^2"
pyyaml = "^6"
toml = "^0.10"
cryptography = "^42"
diskcache = "^5"
sqlite-utils = "^3"
pytest = {version = "^8", optional = true}
pytest-asyncio = {version = "^0.23", optional = true}
respx = {version = "^0.21", optional = true}
llama-cpp-python = {version = "^0.2", optional = true}
torch = {version = "^2", optional = true}
sqlalchemy = {version = "^2.0", optional = true, extras = ["asyncio"]}
asyncpg = {version = "^0.29", optional = true}
tiktoken = {version = "^0.7", optional = true}
qdrant-client = {version = "^1.9", optional = true}
fastapi = {version = "^0.115", optional = true}
uvicorn = {version = "^0.30", extras = ["standard"], optional = true}
tantivy = {version = "^0.22", optional = true}
duckdb = {version = "^1.1", optional = true}
sqlglot = {version = "^25", optional = true}
openpyxl = {version = "^3.1", optional = true}
dbos = {version = ">=2.28.0,<3", optional = true}

[tool.poetry.extras]
dev = ["pytest", "pytest-asyncio", "respx"]
local-inference = ["llama-cpp-python"]
gpu = ["torch", "llama-cpp-python"]
rag = ["qdrant-client", "tantivy"]
a2a = []
personality = []
postgres = ["sqlalchemy", "asyncpg", "psycopg[binary]"]
agents = ["dbos"]
tokens = ["tiktoken"]
api = ["fastapi", "uvicorn"]
dms = ["duckdb", "sqlglot", "openpyxl", "qrcode", "pillow"]
