# Climb / score oracle v1 (CERT-ORACLE-SPLIT, Cortex #343) — NOT a serving input.
#
# CortexOS.crew.cot_climb.gold_sql_for and every exact-SQL climb score read gold
# from this file only. No serving module (the CortexOS/dms answer path, the
# contract /ask path, certified_serve, the semantic loader) opens it:
#   must-fail: tests/test_crew/test_cert_oracle_split.py
#   import-linter: serve-never-reads-oracle
#
# packs/dms/semantic/certified_queries.yaml stays the L0 serve set. It is never
# gold: it was seeded from bench/golden/dms_golden_v1.yaml, so grading against
# it, or on a case it already answers, is memorised by construction. Any case
# whose id, or normalised question text, is in the serve set is excluded from
# every score and named in the report (CortexOS.crew.score_oracle).
#
# Provenance: every entry is copied verbatim (id, question, canonical_sql) from
# the frozen held-out sql split, bench/heldout/c7_heldout_v1.yaml. That split
# was authored outside metrics.yaml, dms_golden_v1 and dms_paraphrase_v1, and
# none of its ids or questions are in the serve set. A test pins every entry
# to its held-out source and fails if an entry overlaps the serve set.
#
# dms_golden_v1 counts toward no score until it is re-split; none of its items
# are here.

version: 1
split: oracle

gold:
  - id: bird_out_kg_above_category_mean
    question: "How many SKUs have total outbound kilogram volume strictly above the mean outbound kilogram volume of other SKUs that share their inventory category?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(*) AS sku_count FROM (
        SELECT s.sku
        FROM (
          SELECT sku, SUM(quantity_kg) AS out_kg
          FROM transactions WHERE txn_type = 'OUT'
          GROUP BY sku
        ) s
        JOIN (
          SELECT sku, MIN(category) AS category FROM inventory GROUP BY sku
        ) i ON i.sku = s.sku
        JOIN (
          SELECT i2.category, AVG(s2.out_kg) AS avg_out
          FROM (
            SELECT sku, SUM(quantity_kg) AS out_kg
            FROM transactions WHERE txn_type = 'OUT' GROUP BY sku
          ) s2
          JOIN (
            SELECT sku, MIN(category) AS category FROM inventory GROUP BY sku
          ) i2 ON i2.sku = s2.sku
          GROUP BY i2.category
        ) c ON c.category = i.category
        WHERE s.out_kg > c.avg_out
      ) x

  - id: bird_delayed_hazardous_to_cold
    question: "Count DELAYED shipments whose SKU is marked hazardous and whose destination location is a cold-storage site."
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(*) AS delayed_count FROM shipments sh JOIN (
        SELECT sku, MAX(CASE WHEN is_hazardous THEN 1 ELSE 0 END) AS haz
        FROM inventory GROUP BY sku
      ) i ON i.sku = sh.sku AND i.haz = 1 JOIN locations l ON l.location_id = sh.destination_location_id WHERE sh.status = 'DELAYED' AND l.is_cold_storage = true

  - id: bird_over_capacity_with_critical_alert
    question: "Which location codes currently hold more kilograms than their stated capacity and also have at least one unresolved CRITICAL alert tied to that location?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT DISTINCT l.location_code FROM locations l JOIN alerts a ON a.related_location = l.location_id WHERE l.current_load_kg > l.capacity_kg
        AND a.resolved = false
        AND a.severity = 'CRITICAL'
      ORDER BY l.location_code

  - id: bird_carrier_delay_rate_above_global
    question: "List carriers whose DELAYED-shipment rate is strictly higher than the overall DELAYED rate across every carrier."
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT c.carrier FROM (
        SELECT carrier,
               SUM(CASE WHEN status = 'DELAYED' THEN 1 ELSE 0 END) * 1.0
                 / COUNT(*) AS delay_rate
        FROM shipments
        GROUP BY carrier
      ) c JOIN (
        SELECT SUM(CASE WHEN status = 'DELAYED' THEN 1 ELSE 0 END) * 1.0
                 / COUNT(*) AS global_rate
        FROM shipments
      ) g ON 1 = 1 WHERE c.delay_rate > g.global_rate ORDER BY c.carrier

  - id: bird_delayed_kg_exceeds_on_hand
    question: "Which destination location codes have more kilograms sitting in DELAYED inbound shipments than the kilograms currently recorded in inventory at that same location?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT l.location_code FROM locations l JOIN (
        SELECT destination_location_id AS location_id, SUM(quantity_kg) AS delayed_kg
        FROM shipments WHERE status = 'DELAYED'
        GROUP BY destination_location_id
      ) d ON d.location_id = l.location_id JOIN (
        SELECT location_id, SUM(quantity_kg) AS on_hand_kg
        FROM inventory GROUP BY location_id
      ) i ON i.location_id = l.location_id WHERE d.delayed_kg > i.on_hand_kg ORDER BY l.location_code

  - id: bird_cold_bin_below_reorder
    question: "How many inventory bins sit in a cold-storage location and currently hold fewer kilograms than that bin's own reorder level, ignoring bins whose reorder level is zero?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(*) AS bin_count FROM inventory i JOIN locations l ON l.location_id = i.location_id WHERE l.is_cold_storage = true
        AND i.reorder_level_kg > 0
        AND i.quantity_kg < i.reorder_level_kg

  - id: bird_stale_audit_with_delayed_inbound
    question: "How many suppliers have a last audit date before 2024-01-01 and also appear on at least one DELAYED shipment?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(*) AS supplier_count FROM suppliers s WHERE CAST(s.last_audit_date AS DATE) < DATE '2024-01-01'
        AND EXISTS (
          SELECT 1 FROM shipments sh
          WHERE sh.supplier_id = s.supplier_id AND sh.status = 'DELAYED'
        )

  - id: bird_inbound_shipments_gt_sku_distinct
    question: "Which location codes are the destination of more inbound shipments than the number of distinct SKUs stored in inventory at that location?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT l.location_code FROM locations l JOIN (
        SELECT destination_location_id AS location_id, COUNT(*) AS inbound_n
        FROM shipments GROUP BY destination_location_id
      ) s ON s.location_id = l.location_id JOIN (
        SELECT location_id, COUNT(DISTINCT sku) AS sku_n
        FROM inventory GROUP BY location_id
      ) i ON i.location_id = l.location_id WHERE s.inbound_n > i.sku_n ORDER BY l.location_code

  - id: spider_country_mean_lead_having
    question: "Which supplier countries have a mean lead time strictly above 20 days and at least three suppliers in that country?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT country FROM suppliers GROUP BY country HAVING AVG(lead_time_days) > 20 AND COUNT(*) >= 3 ORDER BY country

  - id: spider_second_highest_chem_unit_cost
    question: "What is the second-highest distinct unit cost among inventory rows in the CHEMICALS category?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT MAX(unit_cost_myr) AS unit_cost_myr FROM (
        SELECT DISTINCT ROUND(unit_cost_myr, 2) AS unit_cost_myr
        FROM inventory
        WHERE category = 'CHEMICALS'
      ) d WHERE unit_cost_myr < (
        SELECT MAX(ROUND(unit_cost_myr, 2)) FROM inventory WHERE category = 'CHEMICALS'
      )

  - id: spider_sku_in_and_out_same_location
    question: "How many distinct SKUs have both an IN transaction and an OUT transaction recorded against the same location_id?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(*) AS sku_count FROM (
        SELECT t_in.sku, t_in.location_id
        FROM (
          SELECT DISTINCT sku, location_id FROM transactions WHERE txn_type = 'IN'
        ) t_in
        JOIN (
          SELECT DISTINCT sku, location_id FROM transactions WHERE txn_type = 'OUT'
        ) t_out
          ON t_out.sku = t_in.sku AND t_out.location_id = t_in.location_id
      ) x

  - id: spider_chem_supplier_above_country_risk
    question: "List supplier ids that supply at least one CHEMICALS SKU and whose risk_score is strictly above the mean risk_score of other suppliers in the same country."
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT s.supplier_id FROM suppliers s JOIN (
        SELECT country, AVG(risk_score) AS mean_risk
        FROM suppliers GROUP BY country
      ) c ON c.country = s.country WHERE s.risk_score > c.mean_risk
        AND EXISTS (
          SELECT 1 FROM inventory i
          WHERE i.supplier_id = s.supplier_id AND i.category = 'CHEMICALS'
        )
      ORDER BY s.supplier_id

  - id: spider_delayed_sku_never_sold
    question: "How many distinct SKUs appear on a DELAYED shipment but never appear on an OUT transaction?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(DISTINCT sh.sku) AS sku_count FROM shipments sh WHERE sh.status = 'DELAYED'
        AND NOT EXISTS (
          SELECT 1 FROM transactions t
          WHERE t.sku = sh.sku AND t.txn_type = 'OUT'
        )

  - id: spider_unresolved_critical_slow_supplier
    question: "How many unresolved CRITICAL alerts point at a supplier whose lead time is strictly greater than 30 days?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT COUNT(*) AS alert_count FROM alerts a JOIN suppliers s ON s.supplier_id = a.related_supplier WHERE a.resolved = false
        AND a.severity = 'CRITICAL'
        AND s.lead_time_days > 30

  - id: spider_avg_cost_delayed_hazardous
    question: "What is the average shipment cost_myr of DELAYED shipments whose SKU has at least one hazardous inventory row, rounded to two decimals?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT ROUND(AVG(sh.cost_myr), 2) AS avg_cost_myr FROM shipments sh WHERE sh.status = 'DELAYED'
        AND EXISTS (
          SELECT 1 FROM inventory i
          WHERE i.sku = sh.sku AND i.is_hazardous = true
        )

  - id: spider_locations_with_two_unresolved_types
    question: "Which location codes have unresolved alerts of at least two distinct alert_type values?"
    source: bench/heldout/c7_heldout_v1.yaml
    sql: |
      SELECT l.location_code FROM locations l JOIN alerts a ON a.related_location = l.location_id AND a.resolved = false GROUP BY l.location_code HAVING COUNT(DISTINCT a.alert_type) >= 2 ORDER BY l.location_code
