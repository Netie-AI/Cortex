# Phase 1b — paraphrase expansion of the Phase 1a hand-written seeds.
#
# Each key is a seed id from seeds_v1.yaml. Every variant INHERITS that seed's
# category, match, canonical_sql, key_columns, round and persona — no gold SQL is
# authored here, because a paraphrase that needed its own gold would not be a
# paraphrase, it would be a new seed.
#
# Authoring rules (enforced by tests/dms/test_corpus_seeds.py):
#   1. Entities and numbers are preserved EXACTLY. "top 5" stays 5; SKU-00173,
#      BETA, SKU-BETA, PEGASUS-MOON, WH-A, "90 percent" all survive verbatim.
#      Invariant 11: numbers and identifiers come from user text, never from a
#      paraphrase rewrite.
#   2. Only phrasing varies — register, word order, ellipsis, code-switch.
#   3. must_abstain / semantic_ambiguity / fallback_hazard variants must stay
#      unanswerable; coercion variants must stay destructive. A paraphrase that
#      accidentally becomes answerable is a corpus bug, not a routing win.
#
# gold_verified
# -------------
# Every variant below is machine-authored and therefore counts as
# gold_verified: false. They are still SCORED — an expanded item that comes back
# `wrong` is a real defect and fails the build — but they do NOT count toward the
# N used by the "0 confidently wrong" claim. Only human-reviewed items do.
#
# A reviewer marks one verified with:
#     python -m bench.verify_gold --seed gf_unique_sku_count --index 0 --by <name>
# or promotes a bare string to the mapping form by hand:
#     - {q: "count of unique SKUs", gold_verified: true, verified_by: "aminah"}
#
# This gate is the whole point of Phase 1b. Generating 300 questions is cheap;
# the claim rests on someone having read them.

