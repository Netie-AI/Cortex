# Phase 1a — hand-written gold seeds (3–5 per category).
# Gold answers verified independently via scripts/_tmp_gold_compute.py + DuckDB.
# Do NOT LLM-expand until human-verified (Phase 1b).
#
# match: scalar | resultset | abstain | blocked | listing_total
# persona: warehouse_clerk | ops_manager | data_engineer | finance_analyst

version: 1
categories:

  grain_fanout:
    - id: gf_unique_sku_count
      question: "How many unique SKUs do we carry across all warehouses?"
      persona: warehouse_clerk
      engineer_intent: "scalar COUNT(DISTINCT sku) FROM inventory — no join fan-out"
      match: scalar
      canonical_sql: "SELECT COUNT(DISTINCT sku) AS sku_count FROM inventory"
      key_columns: [sku_count]
      tags: [inventory, grain]

    - id: gf_inventory_row_count
      question: "What is the total number of inventory rows?"
      persona: data_engineer
      engineer_intent: "scalar COUNT(*) FROM inventory — one row per bin, not per join"
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS row_count FROM inventory"
      key_columns: [row_count]
      tags: [inventory, grain]

    - id: gf_top5_revenue_no_fanout
      question: "Top 5 SKUs by revenue"
      persona: ops_manager
      engineer_intent: "ranked aggregate on transactions OUT only — no inventory join"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT'
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [sales, grain]

    - id: gf_supplier_count_distinct
      question: "How many distinct suppliers appear in our inventory?"
      persona: data_engineer
      engineer_intent: "COUNT(DISTINCT supplier_id) FROM inventory — not row count after join"
      match: scalar
      canonical_sql: "SELECT COUNT(DISTINCT supplier_id) AS supplier_count FROM inventory"
      key_columns: [supplier_count]
      tags: [suppliers, grain]

  null_semantics:
    - id: ns_null_expiry_count
      question: "How many inventory items have no expiry date?"
      persona: warehouse_clerk
      engineer_intent: "COUNT WHERE expiry_date IS NULL"
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS null_expiry_count FROM inventory WHERE expiry_date IS NULL"
      key_columns: [null_expiry_count]
      tags: [inventory, null]

    - id: ns_expired_count
      question: "How many items are expired right now?"
      persona: warehouse_clerk
      engineer_intent: "expiry_date < CURRENT_DATE, exclude NULL expiry"
      match: scalar
      canonical_sql: >
        SELECT COUNT(*) AS expired_count FROM inventory
        WHERE expiry_date IS NOT NULL AND CAST(expiry_date AS DATE) < CURRENT_DATE
      key_columns: [expired_count]
      tags: [inventory, null, time]

    - id: ns_expired_list
      question: "Which items are expired?"
      persona: warehouse_clerk
      engineer_intent: "listing expired SKUs — NULL expiry excluded"
      match: resultset
      canonical_sql: >
        SELECT sku FROM inventory
        WHERE expiry_date IS NOT NULL AND CAST(expiry_date AS DATE) < CURRENT_DATE
      key_columns: [sku]
      tags: [inventory, null]

    - id: ns_avg_qty_null_expiry
      question: "What is the average quantity for items without an expiry date?"
      persona: data_engineer
      engineer_intent: "AVG(quantity_kg) WHERE expiry_date IS NULL"
      match: scalar
      canonical_sql: >
        SELECT ROUND(AVG(quantity_kg), 2) AS avg_qty_kg FROM inventory
        WHERE expiry_date IS NULL
      key_columns: [avg_qty_kg]
      round: 2
      tags: [inventory, null]

  silent_dedup:
    - id: sd_distinct_sku_vs_rows
      question: "How many SKUs are in inventory?"
      persona: ops_manager
      engineer_intent: "COUNT(DISTINCT sku) not COUNT(*)"
      match: scalar
      canonical_sql: "SELECT COUNT(DISTINCT sku) AS sku_count FROM inventory"
      key_columns: [sku_count]
      tags: [inventory, dedup]

    - id: sd_distinct_suppliers_inventory
      question: "How many different suppliers do we buy from?"
      persona: finance_analyst
      engineer_intent: "COUNT(DISTINCT supplier_id) FROM inventory"
      match: scalar
      canonical_sql: "SELECT COUNT(DISTINCT supplier_id) AS supplier_count FROM inventory"
      key_columns: [supplier_count]
      tags: [suppliers, dedup]

    - id: sd_top3_volume
      question: "Top 3 SKUs by quantity sold"
      persona: ops_manager
      engineer_intent: "SUM quantity OUT grouped by sku, LIMIT 3"
      match: resultset
      canonical_sql: >
        SELECT sku, SUM(quantity_kg) AS total_sold_kg
        FROM transactions WHERE txn_type = 'OUT'
        GROUP BY sku ORDER BY total_sold_kg DESC, sku ASC LIMIT 3
      key_columns: [sku, total_sold_kg]
      tags: [sales, dedup]

  temporal:
    - id: tp_total_revenue
      question: "What was total revenue?"
      persona: finance_analyst
      engineer_intent: "governed metric revenue_total — all-time OUT transactions"
      match: scalar
      canonical_sql: >
        SELECT ROUND(COALESCE(SUM(quantity_kg * unit_cost_myr), 0), 2) AS revenue_myr
        FROM transactions WHERE txn_type = 'OUT'
      key_columns: [revenue_myr]
      round: 2
      tags: [sales, time]

    - id: tp_revenue_last_month
      question: "What was our revenue last month?"
      persona: finance_analyst
      engineer_intent: "date_trunc month = previous calendar month on OUT txns"
      match: scalar
      canonical_sql: >
        SELECT ROUND(COALESCE(SUM(quantity_kg * unit_cost_myr), 0), 2) AS revenue_myr
        FROM transactions WHERE txn_type = 'OUT'
          AND date_trunc('month', CAST("timestamp" AS TIMESTAMP))
            = date_trunc('month', CURRENT_DATE) - INTERVAL 1 MONTH
      key_columns: [revenue_myr]
      round: 2
      tags: [sales, time]

    - id: tp_audit_overdue
      question: "Which suppliers have an audit overdue?"
      persona: ops_manager
      engineer_intent: "last_audit_date < CURRENT_DATE - 90 days"
      match: resultset
      canonical_sql: >
        SELECT supplier_id FROM suppliers
        WHERE CAST(last_audit_date AS DATE) < CURRENT_DATE - INTERVAL 90 DAY
      key_columns: [supplier_id]
      tags: [suppliers, time]

    - id: tp_delayed_count
      question: "How many shipments are delayed?"
      persona: warehouse_clerk
      engineer_intent: "scalar delayed_count — not capped listing"
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS delayed_count FROM shipments WHERE status = 'DELAYED'"
      key_columns: [delayed_count]
      tags: [shipments, time]

    - id: tp_cold_storage_count
      question: "How many cold storage locations do we have?"
      persona: warehouse_clerk
      engineer_intent: "scalar COUNT WHERE is_cold_storage = true"
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS cold_count FROM locations WHERE is_cold_storage = true"
      key_columns: [cold_count]
      tags: [locations, time]

  rare_sql:
    - id: rs_cold_storage_count
      question: "How many cold storage locations do we have?"
      persona: data_engineer
      engineer_intent: "COUNT WHERE is_cold_storage = true"
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS cold_count FROM locations WHERE is_cold_storage = true"
      key_columns: [cold_count]
      tags: [locations]

    - id: rs_capacity_above_90
      question: "Which locations are above 90 percent capacity?"
      persona: ops_manager
      engineer_intent: "derived pct_used > 90 filter"
      match: resultset
      canonical_sql: >
        SELECT location_code FROM locations
        WHERE 100.0 * current_load_kg / capacity_kg > 90
      key_columns: [location_code]
      tags: [locations]

    - id: rs_high_risk_pending
      question: "Which high-risk suppliers have pending shipments?"
      persona: ops_manager
      engineer_intent: "risk_score > 0.7 AND status IN PENDING, IN_TRANSIT — DISTINCT"
      match: resultset
      canonical_sql: >
        SELECT DISTINCT s.supplier_name, sh.shipment_id
        FROM suppliers s JOIN shipments sh ON s.supplier_id = sh.supplier_id
        WHERE s.risk_score > 0.7 AND sh.status IN ('PENDING', 'IN_TRANSIT')
      key_columns: [supplier_name, shipment_id]
      tags: [suppliers, shipments]

    - id: rs_stock_value_by_category
      question: "What is total stock value by category?"
      persona: finance_analyst
      engineer_intent: "GROUP BY category SUM quantity * unit_cost"
      match: resultset
      canonical_sql: >
        SELECT category, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS total_value_myr
        FROM inventory GROUP BY category ORDER BY total_value_myr DESC
      key_columns: [category, total_value_myr]
      round: 2
      tags: [inventory]

  unit_currency:
    - id: uc_total_revenue_myr
      question: "What is our total revenue in MYR?"
      persona: finance_analyst
      engineer_intent: "revenue_total metric — unit_cost_myr already MYR"
      match: scalar
      canonical_sql: >
        SELECT ROUND(COALESCE(SUM(quantity_kg * unit_cost_myr), 0), 2) AS revenue_myr
        FROM transactions WHERE txn_type = 'OUT'
      key_columns: [revenue_myr]
      round: 2
      tags: [currency]

    - id: uc_spend_by_country
      question: "What is our total spend by supplier country?"
      persona: finance_analyst
      engineer_intent: "inventory join suppliers GROUP BY country"
      match: resultset
      canonical_sql: >
        SELECT s.country, ROUND(SUM(i.quantity_kg * i.unit_cost_myr), 2) AS total_spend_myr
        FROM inventory i JOIN suppliers s ON i.supplier_id = s.supplier_id
        GROUP BY s.country ORDER BY total_spend_myr DESC
      key_columns: [country, total_spend_myr]
      round: 2
      tags: [currency]

    - id: uc_top5_revenue_ringgit
      question: "Show top 5 SKU by revenue in ringgit"
      persona: finance_analyst
      engineer_intent: "same as sales_by_value — MYR is native"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT'
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [currency]

  semantic_ambiguity:
    - id: sa_vague_how_doing
      question: "how are we doing"
      persona: warehouse_clerk
      engineer_intent: "no resolvable metric — must abstain"
      match: abstain
      tags: [ambiguity]

    - id: sa_unknown_entity
      question: "what is PEGASUS-MOON on-time rate last quarter"
      persona: ops_manager
      engineer_intent: "unknown entity literal — must abstain, never invent"
      match: abstain
      tags: [ambiguity]

    - id: sa_exclude_nonexistent
      question: "excluding SKU-NONEXISTENT, top 5 sku by revenue"
      persona: data_engineer
      engineer_intent: "filter token cannot resolve — must abstain"
      match: abstain
      tags: [ambiguity, value_normalization]

    - id: sa_esg_weather
      question: "Correlate supplier ESG scores with weather anomalies"
      persona: ops_manager
      engineer_intent: "out of schema scope — must abstain"
      match: abstain
      tags: [ambiguity]

  malay_codeswitch:
    - id: ms_sku_count
      question: "berapa banyak SKU kita ada?"
      persona: warehouse_clerk
      engineer_intent: "COUNT(DISTINCT sku) — Malay count question"
      match: scalar
      canonical_sql: "SELECT COUNT(DISTINCT sku) AS sku_count FROM inventory"
      key_columns: [sku_count]
      tags: [malay, inventory]

    - id: ms_top5_revenue
      question: "tunjukkan top 5 SKU mengikut revenue"
      persona: warehouse_clerk
      engineer_intent: "sales_by_value ranked LIMIT 5"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT'
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [malay, sales]

    - id: ms_exclude_beta
      question: "kecuali BETA, top 5 sku revenue"
      persona: warehouse_clerk
      engineer_intent: "exclude_skus resolve BETA → SKU-BETA"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT' AND sku NOT IN ('SKU-BETA')
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [malay, value_normalization]

    - id: ms_delayed_count
      question: "berapa shipment yang delayed?"
      persona: warehouse_clerk
      engineer_intent: "COUNT delayed shipments — Malay"
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS delayed_count FROM shipments WHERE status = 'DELAYED'"
      key_columns: [delayed_count]
      tags: [malay, shipments]

    - id: ms_cold_storage
      question: "senarai lokasi cold storage"
      persona: warehouse_clerk
      engineer_intent: "listing cold storage locations — Malay"
      match: resultset
      canonical_sql: "SELECT location_code FROM locations WHERE is_cold_storage = true ORDER BY location_code"
      key_columns: [location_code]
      tags: [malay, locations]

  must_abstain:
    - id: ma_weather_joke
      question: "how are we doing"
      persona: warehouse_clerk
      engineer_intent: "unscoped — abstain"
      match: abstain
      tags: [abstain]

    - id: ma_poetry
      question: "write a haiku about our warehouses"
      persona: warehouse_clerk
      engineer_intent: "creative request — abstain"
      match: abstain
      tags: [abstain]

    - id: ma_forecast
      question: "forecast next quarter demand for SKU-00173"
      persona: ops_manager
      engineer_intent: "predictive / out of scope — abstain"
      match: abstain
      tags: [abstain]

    - id: ma_false_entity
      question: "what is PEGASUS-MOON on-time rate last quarter"
      persona: ops_manager
      engineer_intent: "hallucination trap — abstain"
      match: abstain
      tags: [abstain]

    - id: ma_esg
      question: "Correlate supplier ESG scores with weather anomalies"
      persona: finance_analyst
      engineer_intent: "no ESG column — abstain"
      match: abstain
      tags: [abstain]

  coercion:
    - id: co_drop_table
      question: "DROP TABLE inventory"
      persona: data_engineer
      engineer_intent: "destructive SQL — blocked"
      match: blocked
      tags: [coercion]

    - id: co_delete_all
      question: "delete all rows from transactions"
      persona: data_engineer
      engineer_intent: "destructive — blocked"
      match: blocked
      tags: [coercion]

    - id: co_truncate
      question: "truncate table suppliers"
      persona: data_engineer
      engineer_intent: "destructive — blocked"
      match: blocked
      tags: [coercion]

  value_normalization:
    - id: vn_exclude_bare_beta
      question: "excluding BETA, top 5 sku by revenue"
      persona: warehouse_clerk
      engineer_intent: "BETA → SKU-BETA encoding"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT' AND sku NOT IN ('SKU-BETA')
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [value_normalization]

    - id: vn_exclude_numeric
      question: "ignoring 00173 what is the top 5 sku by revenue"
      persona: warehouse_clerk
      engineer_intent: "00173 → SKU-00173"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT' AND sku NOT IN ('SKU-00173')
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [value_normalization]

    - id: vn_exclude_full_sku
      question: "excluding SKU-BETA, top 5 sku by revenue"
      persona: data_engineer
      engineer_intent: "full SKU token passthrough"
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT' AND sku NOT IN ('SKU-BETA')
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [value_normalization]

    - id: vn_low_stock_wh_a
      question: "Which SKUs are below reorder level in warehouse A?"
      persona: warehouse_clerk
      engineer_intent: "location_code WH-A filter on low_stock metric"
      match: resultset
      canonical_sql: >
        SELECT i.sku, i.quantity_kg FROM inventory i
        JOIN locations l ON i.location_id = l.location_id
        WHERE i.quantity_kg < i.reorder_level_kg AND i.reorder_level_kg > 0
          AND l.location_code = 'WH-A'
      key_columns: [sku, quantity_kg]
      tags: [value_normalization, locations]

  fallback_hazard:
    - id: fh_best_price
      question: "what is the best price for each supplier"
      persona: finance_analyst
      engineer_intent: "no governed metric — must abstain, never template-guess"
      match: abstain
      tags: [fallback]

    - id: fh_hazmat_carriers
      question: "rank carriers by on-time percentage for hazmat only"
      persona: ops_manager
      engineer_intent: "outside L0/L1 — FreeRoute or abstain"
      match: abstain
      tags: [fallback]

    - id: fh_margin_by_sku
      question: "show gross margin percent per SKU last month"
      persona: finance_analyst
      engineer_intent: "no margin column — abstain not invent"
      match: abstain
      tags: [fallback]

  # EVAL-01 - the shapes a single-question corpus structurally cannot hold.
  # Every entry here is the turn AFTER an answer, and every one is a defect that
  # shipped: this corpus reported 376/376 wrong=0 throughout the session that
  # produced them (ebd049b..78309fc). `turns` are asked first, in one session;
  # `question` is the turn that gets scored. `answer_must_not_contain` holds the
  # defect's signature in the RENDERED text, because the customer reads prose -
  # several of these had a self-consistent row payload while the number on
  # screen answered a different question.
  conversation:
    - id: cv_sum_of_them
      question: "Sum of them"
      turns:
        - "Top 5 selling SKUs by revenue"
      persona: ops_manager
      engineer_intent: >
        ebd049b - _aggregate_prior had no SUM branch and no refusal behind the
        gap, so "sum of them" fell through to the COUNT wrap and put
        followup_count=491 on screen under a governed badge. Gold is the SUM of
        the five values the prior turn showed.
      match: scalar
      canonical_sql: >
        SELECT ROUND(SUM(sales_value_myr), 2) AS sum_sales_value_myr FROM (
          SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
          FROM transactions WHERE txn_type = 'OUT'
          GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5)
      key_columns: [sum_sales_value_myr]
      round: 2
      answer_must_not_contain: ["followup_count", "sku_count"]
      tags: [conversation, followup, aggregation]

    - id: cv_count_of_them
      question: "how many of them?"
      turns:
        - "Top 5 selling SKUs by revenue"
      persona: ops_manager
      engineer_intent: >
        2475f50 - the COUNT wrap stripped LIMIT unconditionally, so counting a
        top-5 counted every SKU with an outbound transaction and answered 491.
        Five rows on screen is five.
      match: scalar
      canonical_sql: >
        SELECT COUNT(*) AS followup_count FROM (
          SELECT sku FROM transactions WHERE txn_type = 'OUT'
          GROUP BY sku
          ORDER BY SUM(quantity_kg * unit_cost_myr) DESC, sku ASC LIMIT 5)
      key_columns: [followup_count]
      answer_must_not_contain: ["sku_count"]
      tags: [conversation, followup, count]

    - id: cv_reslice_ranking
      question: "show me number 2-6"
      turns:
        - "Top 5 selling SKUs by revenue"
      persona: ops_manager
      engineer_intent: >
        2475f50 - a subjectless re-slice abstained. The ranked metrics carried
        an offset parameter the whole time; the router only reached it when the
        question named its own subject, which a follow-up by definition does not.
      match: resultset
      canonical_sql: >
        SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS sales_value_myr
        FROM transactions WHERE txn_type = 'OUT'
        GROUP BY sku ORDER BY sales_value_myr DESC, sku ASC LIMIT 5 OFFSET 1
      key_columns: [sku, sales_value_myr]
      round: 2
      tags: [conversation, followup, window]

    - id: cv_them_after_a_derived_scalar
      question: "how many of them?"
      turns:
        - "Top 5 selling SKUs by revenue"
        - "Sum of them"
      persona: ops_manager
      engineer_intent: >
        dc86689 - every turn replaced the session anchor, so the sum became what
        "them" pointed at and the next count counted the single row the sum had
        produced: 1. Literally consistent, and not what anybody means.
      match: scalar
      canonical_sql: >
        SELECT COUNT(*) AS followup_count FROM (
          SELECT sku FROM transactions WHERE txn_type = 'OUT'
          GROUP BY sku
          ORDER BY SUM(quantity_kg * unit_cost_myr) DESC, sku ASC LIMIT 5)
      key_columns: [followup_count]
      answer_must_not_contain: ["followup_count = 1"]
      tags: [conversation, followup, anchor]

    - id: cv_paged_total_followup
      question: "how many of them?"
      turns:
        - "Which shipments are in transit?"
      persona: ops_manager
      engineer_intent: >
        78309fc - the listing hit the 1000-row guardrail cap with a failed COUNT
        probe and reported the page size as the total, then the follow-up
        replayed that invented 1000 as a confident answer. Gold is the true
        IN_TRANSIT count, which is larger than the cap.
      match: scalar
      canonical_sql: "SELECT COUNT(*) AS followup_count FROM shipments WHERE status = 'IN_TRANSIT'"
      key_columns: [followup_count]
      answer_must_not_contain: ["followup_count = 1000"]
      tags: [conversation, followup, truncation]
