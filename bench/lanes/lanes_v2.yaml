- id: c7_bird_out_kg_above_category_mean
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: How many SKUs have total outbound kilogram volume strictly above the mean outbound kilogram
    volume of other SKUs that share their inventory category?
  source: c7_heldout_v1/bird_out_kg_above_category_mean
  gold:
    canonical_sql: SELECT COUNT(*) AS sku_count FROM ( SELECT s.sku FROM ( SELECT sku, SUM(quantity_kg)
      AS out_kg FROM transactions WHERE txn_type = 'OUT' GROUP BY sku ) s JOIN ( SELECT sku, MIN(category)
      AS category FROM inventory GROUP BY sku ) i ON i.sku = s.sku JOIN ( SELECT i2.category, AVG(s2.out_kg)
      AS avg_out FROM ( SELECT sku, SUM(quantity_kg) AS out_kg FROM transactions WHERE txn_type = 'OUT'
      GROUP BY sku ) s2 JOIN ( SELECT sku, MIN(category) AS category FROM inventory GROUP BY sku ) i2
      ON i2.sku = s2.sku GROUP BY i2.category ) c ON c.category = i.category WHERE s.out_kg > c.avg_out
      ) x
    key_columns:
    - sku_count
    match: scalar
    round: 4
- id: c7_bird_delayed_hazardous_to_cold
