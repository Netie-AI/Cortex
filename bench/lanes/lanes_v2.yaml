- id: c7_spider_sku_in_and_out_same_location
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: How many distinct SKUs have both an IN transaction and an OUT transaction recorded against
    the same location_id?
  source: c7_heldout_v1/spider_sku_in_and_out_same_location
  gold:
    canonical_sql: SELECT COUNT(DISTINCT t_in.sku) AS sku_count FROM ( SELECT DISTINCT sku, location_id
      FROM transactions WHERE txn_type = 'IN' ) t_in JOIN ( SELECT DISTINCT sku, location_id FROM transactions
      WHERE txn_type = 'OUT' ) t_out ON t_out.sku = t_in.sku AND t_out.location_id = t_in.location_id
    key_columns:
    - sku_count
    match: scalar
    round: 4
    rule: Counts distinct SKUs (lanes_v2 ruling 3). lanes_v1 counted distinct (sku, location_id) pairs,
      so a SKU with IN and OUT at two sites counted twice. Diverges from c7_heldout_v1, which carries
      the pair count.
- id: c7_spider_chem_supplier_above_country_risk
