# LANES-V2 - frozen lane labels for the LANE-ROUTER-01 measurement.
#
# lanes_v1 with its label review applied (plan section 6.1): a blind relabel by a
# different model family (MiniMax), the founder's rulings 1-3 of 2026-10-31 and the
# founder-delegated rulings 4-5. Same 535 items and ids as lanes_v1; nothing dropped.
# lanes_v1.yaml is unchanged (sha256 ca54d0d439d6180b1afac17573c2cb58e1ec955f62f32156a605f7e508c3b8b7).
#
# Not a development golden and not a serving input: nothing on the answer path
# reads this file. bench/lanes.py loads it; tests/dms/test_lanes_v2_set.py pins
# its counts, its sha256 (lanes_v2.sha256), its gold and its label review.
#
# Frozen. Any change, including a dropped item, is lanes_v3.
#
# Splits: `train` is the only split the router prompt may be tuned on (at most
# 5 logged iterations, plus BIRD split A as negatives). `heldout` is never used
# for tuning. A paraphrase `group` never straddles the splits. Every
# c7_heldout_v1 item, every MUST_BLOCK item and the test-derived lists from
# tests/dms/test_destructive_intent.py are pinned to `heldout`.
#
# Corpus: bench/lanes/docs/*.txt, fictional documents written to be confusable
# with the warehouse. Production CONTRACTS_DIR is unchanged; a measurement run
# mounts this corpus itself.

version: 2
name: lanes_v2
frozen: true
supersedes: lanes_v1
corpus: bench/lanes/docs
datasets:
  item_fields:
    id: unique item id
    split: train | heldout
    kind: doc_hit | doc_miss | data | destructive | general | ambiguous | injection
    lane: >-
      the gold lane decision: documents when the question asks about a document
      (a listed document, or a named document that is not in the library),
      whether or not the answer is in it; a document miss falls through to the
      SQL ladder. other for everything else (records, greetings, general
      knowledge, change requests, unclear questions)
    accept: >-
      served outcomes that are not wrong: document (a cited document answer),
      rows (a data answer), abstain (abstain, blocked, reconfirm, refused).
      A refusal is always MISS, never WRONG.
    question: the question exactly as asked
    group: optional paraphrase group; all members share a split
    source: optional origin when the item is copied from an existing set
    must_block: true for the 16 MUST_BLOCK questions (bar B4, engine mode)
    gold.doc: doc_hit only - the corpus file that holds the answer
    gold.facts: doc_hit only - spans every RIGHT answer contains (normalised)
    gold.canonical_sql: data gold - run through bench.accuracy._run_canonical
    gold.key_columns: data gold - columns compared as a multiset
    gold.match: scalar | resultset
    gold.round: digits for numeric comparison
    gold.rule: optional - the counting rule the gold applies, stated where it is not obvious
  document_kinds: [doc_hit, doc_miss]
  router_served_document_allowed_on: [doc_hit]
# Plan section 6.1 review. status stays pending until the founder records the
# 10% spot check: review_problems() requires it for complete.
review:
  status: pending
  status_reason: every disagreement is ruled, but bench.lanes.review_problems() requires review.founder_spot_check
    for status complete ('review.founder_spot_check is not recorded'); the founder's 10% spot check is
    still owed
  owed:
  - 'founder_spot_check: the 54 items in founder_spot_check_sample'
  writer:
    family: claude
    role: drafted every item, the corpus and the gold
  labeler: minimaxai/minimax-m3.1-flash (NVIDIA API), temperature 0, blind relabel of all 535 lanes_v1
    items, 2026-10-31
  labeler_family: minimax
  kappa: 0.9315
  kappa_detail:
    all:
      n: 535
      lane: 0.9315
      kind: 0.9767
      accept: 0.7194
    heldout:
      n: 470
      lane: 0.9209
      kind: 0.9737
      accept: 0.7039
    train:
      n: 65
      lane: 1.0
      kind: 1.0
      accept: 0.8241
