- id: data_below_reorder_wh-a
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: How many inventory rows at WH-A hold less than their reorder level?
  gold:
    canonical_sql: SELECT COUNT(*) AS row_count FROM inventory i JOIN locations l ON (i.location_id =
      l.location_id OR lower(trim(i.location_id)) = lower(trim(l.location_name)) OR regexp_replace(lower(trim(i.location_id)),
      '^(warehouse|whse|wh)[ _-]*', '') = regexp_replace(lower(trim(l.location_code)), '^(warehouse|whse|wh)[
      _-]*', '')) WHERE l.location_code = 'WH-A' AND i.quantity_kg < i.reorder_level_kg
    key_columns:
    - row_count
    match: scalar
    round: 4
    rule: 'Site dual-coding (lanes_v2 ruling 3): an inventory row counts toward a site when its location_id
      is the site''s locations.location_id, or equals the site''s location_name, or names the site''s
      location_code in another spelling. Two spellings name the same site when they are equal after lowercasing,
      trimming and dropping a leading ''warehouse'', ''whse'' or ''wh'' and the space, ''_'' or ''-''
      after it: the prefixes and separators locations_clean.csv and locations_messy.csv use for location_code
      (WH-A, WAREHOUSE C, whse a, wh_j). So ''Warehouse A'' is WH-A and ''wh_o'' and ''whse o'' are WH-O.
      Every inventory row maps to exactly one site under this rule.'
