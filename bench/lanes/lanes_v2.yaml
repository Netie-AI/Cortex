      2) AS unit_cost_myr FROM inventory WHERE category = 'CHEMICALS' ) d WHERE unit_cost_myr < ( SELECT
      MAX(ROUND(unit_cost_myr, 2)) FROM inventory WHERE category = 'CHEMICALS' )
    key_columns:
