  - rows
  question: How many distinct SKUs have both an IN transaction and an OUT transaction recorded against
    the same location_id?
  source: c7_heldout_v1/spider_sku_in_and_out_same_location
  gold:
    canonical_sql: SELECT COUNT(*) AS sku_count FROM ( SELECT t_in.sku, t_in.location_id FROM ( SELECT
      DISTINCT sku, location_id FROM transactions WHERE txn_type = 'IN' ) t_in JOIN ( SELECT DISTINCT
      sku, location_id FROM transactions WHERE txn_type = 'OUT' ) t_out ON t_out.sku = t_in.sku AND t_out.location_id
      = t_in.location_id ) x
    key_columns:
    - sku_count
    match: scalar
    round: 4
- id: c7_spider_chem_supplier_above_country_risk
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: List supplier ids that supply at least one CHEMICALS SKU and whose risk_score is strictly
    above the mean risk_score of other suppliers in the same country.
  source: c7_heldout_v1/spider_chem_supplier_above_country_risk
  gold:
    canonical_sql: SELECT s.supplier_id FROM suppliers s JOIN ( SELECT country, AVG(risk_score) AS mean_risk
      FROM suppliers GROUP BY country ) c ON c.country = s.country WHERE s.risk_score > c.mean_risk AND
      EXISTS ( SELECT 1 FROM inventory i WHERE i.supplier_id = s.supplier_id AND i.category = 'CHEMICALS'
      ) ORDER BY s.supplier_id
    key_columns:
    - supplier_id
    match: resultset
    round: 4
