    canonical_sql: SELECT MAX(unit_cost_myr) AS unit_cost_myr FROM ( SELECT DISTINCT ROUND(unit_cost_myr,
      2) AS unit_cost_myr FROM inventory WHERE category = 'CHEMICALS' ) d WHERE unit_cost_myr < ( SELECT
      MAX(ROUND(unit_cost_myr, 2)) FROM inventory WHERE category = 'CHEMICALS' )
    key_columns:
    - unit_cost_myr
    match: scalar
    round: 2
- id: c7_spider_sku_in_and_out_same_location
  split: heldout
