- id: c7_bird_cold_bin_below_reorder
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: How many inventory bins sit in a cold-storage location and currently hold fewer kilograms
    than that bin's own reorder level, ignoring bins whose reorder level is zero?
  source: c7_heldout_v1/bird_cold_bin_below_reorder
  gold:
    canonical_sql: SELECT COUNT(*) AS bin_count FROM inventory i JOIN locations l ON l.location_id = i.location_id
      WHERE l.is_cold_storage = true AND i.reorder_level_kg > 0 AND i.quantity_kg < i.reorder_level_kg
    key_columns:
    - bin_count
    match: scalar
    round: 4
- id: c7_bird_stale_audit_with_delayed_inbound
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: How many suppliers have a last audit date before 2024-01-01 and also appear on at least one
    DELAYED shipment?
  source: c7_heldout_v1/bird_stale_audit_with_delayed_inbound
  gold:
    canonical_sql: SELECT COUNT(*) AS supplier_count FROM suppliers s WHERE CAST(s.last_audit_date AS
      DATE) < DATE '2024-01-01' AND EXISTS ( SELECT 1 FROM shipments sh WHERE sh.supplier_id = s.supplier_id
      AND sh.status = 'DELAYED' )
    key_columns:
    - supplier_count
    match: scalar
    round: 4
- id: c7_bird_inbound_shipments_gt_sku_distinct
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: Which location codes are the destination of more inbound shipments than the number of distinct
    SKUs stored in inventory at that location?
  source: c7_heldout_v1/bird_inbound_shipments_gt_sku_distinct
  gold:
    canonical_sql: SELECT l.location_code FROM locations l JOIN ( SELECT destination_location_id AS location_id,
      COUNT(*) AS inbound_n FROM shipments GROUP BY destination_location_id ) s ON s.location_id = l.location_id
      JOIN ( SELECT location_id, COUNT(DISTINCT sku) AS sku_n FROM inventory GROUP BY location_id ) i
      ON i.location_id = l.location_id WHERE s.inbound_n > i.sku_n ORDER BY l.location_code
    key_columns:
    - location_code
    match: resultset
    round: 4
