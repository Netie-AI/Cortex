- id: c7_bird_carrier_delay_rate_above_global
  split: heldout
  kind: data
  lane: other
  accept:
  - rows
  question: List carriers whose DELAYED-shipment rate is strictly higher than the overall DELAYED rate
    across every carrier.
  source: c7_heldout_v1/bird_carrier_delay_rate_above_global
  gold:
    canonical_sql: SELECT c.carrier FROM ( SELECT carrier, SUM(CASE WHEN status = 'DELAYED' THEN 1 ELSE
      0 END) * 1.0 / COUNT(*) AS delay_rate FROM shipments GROUP BY carrier ) c JOIN ( SELECT SUM(CASE
      WHEN status = 'DELAYED' THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS global_rate FROM shipments ) g ON
      1 = 1 WHERE c.delay_rate > g.global_rate ORDER BY c.carrier
    key_columns:
    - carrier
    match: resultset
    round: 4
